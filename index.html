<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maadylan Portal | Management Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans">

    <div id="authScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-indigo-700">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-black text-indigo-700">Maadylan Portal</h1>
                <p id="authSubtitle" class="text-gray-500 mt-2 text-sm">Sign in to your professional suite</p>
            </div>
            <div class="space-y-4">
                <div id="signUpFields" class="hidden space-y-4">
                    <input id="fullName" type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    <input id="phone" type="tel" placeholder="Phone Number" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <input id="email" type="email" placeholder="Email Address" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="roleSelectArea" class="hidden py-2">
                    <select id="userRole" class="w-full p-2 border rounded bg-gray-50 text-sm">
                        <option value="Student">Student Account</option>
                        <option value="Teacher">Teacher Account</option>
                    </select>
                </div>
                <button id="mainBtn" onclick="handleAuth()" class="w-full bg-indigo-700 text-white py-3 rounded-lg font-bold hover:bg-indigo-800 transition">Sign In</button>
                <p class="text-center text-sm text-gray-500">
                    <button onclick="toggleAuthMode()" id="toggleBtn" class="text-indigo-600 font-bold hover:underline">Create an Account</button>
                </p>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden min-h-screen">
        <nav class="bg-indigo-700 p-4 text-white shadow-lg flex justify-between items-center px-8">
            <h1 class="font-bold text-lg italic">Maadylan Portal <span id="roleLabel" class="ml-2 text-[9px] bg-white text-indigo-700 px-2 py-0.5 rounded-full uppercase font-black"></span></h1>
            <div class="flex items-center gap-4">
                <span id="userNameDisplay" class="text-sm font-bold border-r pr-4 border-indigo-400"></span>
                <button onclick="signOut()" class="bg-white/10 px-4 py-1.5 rounded text-xs font-bold hover:bg-white/20">Sign Out</button>
            </div>
        </nav>

        <div class="container mx-auto mt-8 p-4">
            <div id="adminView" class="hidden space-y-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <h2 class="text-2xl font-black text-gray-800"><i class="fas fa-tools mr-2 text-red-500"></i>Command Center</h2>
                    <div class="relative w-full md:w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="adminSearch" onkeyup="filterDirectory()" placeholder="Search name or email..." class="w-full pl-10 p-2 border rounded-full text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white rounded-2xl shadow-sm border p-6">
                        <h3 class="font-bold text-gray-600 mb-4 uppercase text-xs tracking-widest">Verify Teachers</h3>
                        <div id="pendingTeachersList" class="space-y-3"></div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border p-6">
                        <h3 class="font-bold text-gray-600 mb-4 uppercase text-xs tracking-widest">Student Directory</h3>
                        <div id="allStudentsList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>

            <div id="userView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="space-y-6">
                    <div id="teacherControls" class="hidden bg-white p-6 rounded-2xl shadow border-t-4 border-indigo-500">
                        <h3 class="font-bold text-xs text-gray-400 mb-4 uppercase">Post Announcement</h3>
                        <textarea id="annInput" class="w-full border p-3 rounded-lg text-sm mb-3" rows="3" placeholder="Message to class..."></textarea>
                        <button onclick="dbPostAnnouncement()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold">Post Now</button>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div id="liveStream" class="bg-white p-8 rounded-2xl shadow min-h-[400px]">
                        <h2 class="font-bold text-gray-700 border-b pb-4 mb-4">Classroom Stream</h2>
                        <div id="streamContent" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD2ZmMC4DCK7JhPnFU1oPMHvU-RllpcOqw",
            authDomain: "maadylan-classroom.firebaseapp.com",
            projectId: "maadylan-classroom",
            storageBucket: "maadylan-classroom.firebasestorage.app",
            messagingSenderId: "826023847616",
            appId: "1:826023847616:web:138bb211715a2a51152f25"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = "admin.rsc@gmail.com";
        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('signUpFields').classList.toggle('hidden');
            document.getElementById('roleSelectArea').classList.toggle('hidden');
            document.getElementById('mainBtn').innerText = isSignUpMode ? "Register Account" : "Sign In";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.toLowerCase();
            const pw = document.getElementById('password').value;
            const role = document.getElementById('userRole').value;
            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;

            try {
                if (isSignUpMode) {
                    if(!name) return alert("Please enter your name");
                    const res = await auth.createUserWithEmailAndPassword(email, pw);
                    let finalRole = (email === ADMIN_EMAIL) ? 'Admin' : role;
                    await db.collection("users").doc(res.user.uid).set({
                        fullName: name,
                        phone: phone,
                        email: email,
                        role: finalRole,
                        approved: (finalRole === 'Student' || finalRole === 'Admin'),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else { await auth.signInWithEmailAndPassword(email, pw); }
            } catch (e) { alert(e.message); }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('userNameDisplay').innerText = data.fullName || data.email;
                        if (data.role === 'Admin') loadAdminUI();
                        else showUserUI(data.role);
                    }
                });
            }
        });

        function loadAdminUI() {
            hideAll();
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('adminView').classList.remove('hidden');
            document.getElementById('roleLabel').innerText = "System Admin";
            
            db.collection("users").where("role", "==", "Teacher").where("approved", "==", false)
                .onSnapshot(snap => {
                    const list = document.getElementById('pendingTeachersList');
                    list.innerHTML = snap.empty ? '<p class="text-xs text-gray-400 italic">No pending teachers.</p>' : "";
                    snap.forEach(doc => {
                        const t = doc.data();
                        list.innerHTML += `<div class="p-3 bg-gray-50 border rounded flex justify-between items-center text-xs search-item" data-text="${t.fullName} ${t.email}">
                            <div><b>${t.fullName}</b><br><span class="opacity-60">${t.email}</span></div>
                            <button onclick="approveUser('${doc.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded font-bold">Approve</button>
                        </div>`;
                    });
                });

            db.collection("users").where("role", "==", "Student")
                .onSnapshot(snap => {
                    const list = document.getElementById('allStudentsList');
                    list.innerHTML = "";
                    snap.forEach(doc => {
                        const s = doc.data();
                        list.innerHTML += `<div class="p-2 bg-indigo-50 border rounded text-xs search-item" data-text="${s.fullName} ${s.email}">
                            <i class="fas fa-user-graduate mr-2"></i><b>${s.fullName}</b> (${s.email})
                        </div>`;
                    });
                });
        }

        function filterDirectory() {
            const query = document.getElementById('adminSearch').value.toLowerCase();
            document.querySelectorAll('.search-item').forEach(item => {
                const text = item.getAttribute('data-text').toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
                if (item.classList.contains('p-2')) item.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        function showUserUI(role) {
            hideAll();
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('userView').classList.remove('hidden');
            document.getElementById('roleLabel').innerText = role;
            if(role === 'Teacher') document.getElementById('teacherControls').classList.remove('hidden');
            listenToStream();
        }

        function hideAll() { 
            document.getElementById('authScreen').classList.add('hidden'); 
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('userView').classList.add('hidden');
        }

        async function approveUser(id) { await db.collection("users").doc(id).update({ approved: true }); }
        function signOut() { auth.signOut().then(() => location.reload()); }
        
        async function dbPostAnnouncement() {
            const val = document.getElementById('annInput').value;
            const senderName = document.getElementById('userNameDisplay').innerText;
            if(val) await db.collection("announcements").add({ 
                content: val, 
                author: senderName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            });
            document.getElementById('annInput').value = "";
        }

        function listenToStream() {
            db.collection("announcements").orderBy("timestamp", "desc").onSnapshot(snap => {
                const stream = document.getElementById('streamContent');
                stream.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    stream.innerHTML += `
                        <div class="p-4 bg-indigo-50 border-l-4 border-indigo-500 rounded text-sm mb-2 shadow-sm">
                            <p class="font-bold text-indigo-700 text-xs mb-1">${data.author || 'Teacher'}</p>
                            <p>${data.content}</p>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
